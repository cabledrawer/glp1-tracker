name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app for iPhone
        run: |
          xcodebuild \
            -project GLP1Tracker.xcodeproj \
            -scheme GLP1Tracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GLP1Tracker.app Payload/
          zip -qr GLP1Tracker.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: GLP1Tracker-ipa
          path: GLP1Tracker.ipa
          retention-days: 30
